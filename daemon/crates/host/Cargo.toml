[package]
name = "orcadeck-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Stream Deck SDK v2 compatible plugin host for the OrcaDeck daemon"


# Sync tungstenite + std threads: a blocking accept thread plus one blocking reader thread per
# socket. Nothing polls, so the host sits at 0 % CPU when idle, and there is no async runtime in
# the binary. A handful of plugins means a handful of threads, which is cheaper than tokio.
[dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde_json = "1"
log = "0.4"
# OS CSPRNG for plugin UUIDs, contexts and inspector tokens. Already in the tree via tungstenite.
getrandom = "0.4"
