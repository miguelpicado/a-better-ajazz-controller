[package]
name = "orcadeck"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Lightweight daemon for the AJAZZ Stream Dock AKP153E"

[workspace]
members = ["crates/host", "crates/plugman", "crates/builtin", "crates/web"]

# Internal workspace: nothing is published to crates.io. rust-version matches the toolchain
# the release builds are made with (rustc 1.99.0).
[workspace.package]
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false

[dependencies]
orcadeck-host = { path = "crates/host" }
orcadeck-builtin = { path = "crates/builtin" }
orcadeck-web = { path = "crates/web" }
base64 = "0.22"
hidapi = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
