name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['daemon/**', 'tools/e2e/**', 'tools/smoke/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['daemon/**', 'tools/e2e/**', 'tools/smoke/**', '.github/workflows/ci.yml']

env:
  CARGO_TERM_COLOR: always
  # daemon/rust-toolchain.toml pins the local gnullvm toolchain (not on the runner): use the
  # runner's stable MSVC toolchain instead. The code is Windows-only (named pipe, Win32).
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # fake_plugin tests spawn a Node plugin
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            daemon/target
          key: cargo-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo build --release --workspace
      - name: smoke (release binary)
        shell: pwsh
        run: pwsh -File ../tools/smoke/smoke.ps1 -Exe target/release/orcadeck.exe
      - run: cargo test --release --workspace
      # E2E after the Rust gate: the release binary is already built, and a source regression
      # fails in cargo test before spending time on npm/browser setup.
      - name: e2e npm ci
        working-directory: tools/e2e
        run: npm ci
      - name: e2e browser cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ hashFiles('tools/e2e/package-lock.json') }}
      - name: e2e browser
        working-directory: tools/e2e
        run: npx playwright install chromium
      - name: e2e (Playwright)
        working-directory: tools/e2e
        env:
          ORCADECK_BIN: ${{ github.workspace }}\daemon\target\release\orcadeck.exe
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            tools/e2e/test-results
            tools/e2e/playwright-report
          if-no-files-found: ignore

  lint:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            daemon/target
          key: cargo-lint-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: cargo-lint-
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      # Blocking: warnings fail the job. The report is uploaded either way for reading.
      - name: clippy
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --message-format short -- -D warnings 2>&1 | Tee-Object -FilePath clippy.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: clippy-report
          path: daemon/clippy.txt
          if-no-files-found: ignore
